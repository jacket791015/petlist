<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寵物吃喝玩樂地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root {
    --green: #2f6f3e;
    --line: #d9ded8;
    --text: #26302a;
    --muted: #6d766f;
    --surface: #fff;
    --bg: #f4f6f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 30; padding: 14px 16px; background: var(--green); color: #fff; }
  header h1 { margin: 0; font-size: 18px; line-height: 1.25; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .92; }
  .toolbar { position: sticky; top: 54px; z-index: 25; display: grid; grid-template-columns: 1.3fr 1fr 1fr minmax(120px,.75fr) auto; gap: 8px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .toolbar input, .toolbar select { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #cbd2cb; border-radius: 6px; font-size: 14px; background: #fff; color: var(--text); }
  .mode-switch { display: inline-flex; height: 38px; overflow: hidden; border: 1px solid #cbd2cb; border-radius: 6px; background: #fff; }
  .mode-switch button { min-width: 54px; padding: 0 10px; border: 0; border-right: 1px solid #cbd2cb; background: #fff; color: var(--text); font-size: 13px; cursor: pointer; }
  .mode-switch button:last-child { border-right: 0; }
  .mode-switch button.active { background: var(--green); color: #fff; }
  .stats { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
  #loading { padding: 40px; text-align: center; color: var(--muted); }
  #content { padding: 2px 8px 18px; }
  .county-group { margin: 10px 0; }
  .county-title { padding: 7px 4px; border-bottom: 2px solid var(--green); color: var(--green); font-size: 15px; font-weight: 700; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { margin: 8px 0; padding: 12px; border: 1px solid #e5e9e4; border-radius: 8px; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .name { font-weight: 650; font-size: 15px; line-height: 1.4; }
  .meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .rating { color: #c98206; font-weight: 700; }
  .addr { margin-top: 5px; color: #7b847d; font-size: 12px; line-height: 1.5; }
  .extra { margin-top: 6px; color: #3c463f; font-size: 12px; line-height: 1.6; }
  .extra b { color: var(--green); }
  a.maplink { color: var(--green); text-decoration: none; font-size: 12px; font-weight: 600; }
  a.maplink:hover { text-decoration: underline; }
  #mapShell { display: none; height: calc(100vh - 149px); min-height: 460px; }
  #map { width: 100%; height: 100%; background: #dde5dd; }
  .map-panel { position: absolute; top: 164px; right: 12px; z-index: 20; width: min(320px, calc(100vw - 24px)); padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.96); box-shadow: 0 4px 18px rgba(0,0,0,.12); color: var(--muted); font-size: 12px; }
  .map-panel strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 13px; }
  .map-panel button { width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #cbd2cb; border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; }
  .popup-name { margin-bottom: 4px; font-weight: 700; line-height: 1.35; }
  .popup-meta, .popup-addr { color: #58635b; font-size: 12px; line-height: 1.45; }
  .empty { padding: 40px 12px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) {
    header { padding: 12px; }
    .toolbar { top: 50px; grid-template-columns: 1fr 1fr; }
    .toolbar input:first-child, .mode-switch { grid-column: 1 / -1; }
    .mode-switch { width: 100%; }
    .mode-switch button { flex: 1; }
    .stats { flex-direction: column; gap: 2px; }
    #mapShell { height: calc(100vh - 232px); min-height: 420px; }
    .map-panel { left: 8px; right: 8px; top: auto; bottom: 12px; width: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>寵物吃喝玩樂地圖</h1>
  <p>直接讀取 Google Sheet，支援清單模式與地圖模式</p>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="搜尋店名、類別、地址...">
  <input type="text" id="dateSearch" placeholder="搜尋造訪日期...">
  <input type="text" id="noteSearch" placeholder="搜尋心得備註...">
  <select id="countyFilter"><option value="">全部縣市</option></select>
  <div class="mode-switch" aria-label="顯示模式">
    <button type="button" id="listModeBtn" class="active">清單</button>
    <button type="button" id="mapModeBtn">地圖</button>
  </div>
</div>

<div class="stats">
  <span id="stats">讀取中...</span>
  <span id="geoStats"></span>
</div>
<div id="loading">正在讀取 Google Sheet...</div>
<div id="content"></div>
<div id="mapShell">
  <div id="map"></div>
  <div class="map-panel" id="mapPanel">
    <strong>地圖模式</strong>
    <div id="mapStatus">切換到地圖後會依地址建立座標標記。</div>
    <button type="button" id="fitMapBtn">顯示目前篩選結果</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const SHEET_ID = atob('MWxGeFF3V3U3OE0xaEE1Q2ZNNHJzMUFVSWw3MGhuZUhtMFJ2ZlNObWc2VUU=');
const SHEET_NAME = 'pet_list_final';
const URL_GVIZ = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
const COUNTY_ORDER = ['臺北市','新北市','基隆市','桃園市','新竹市','新竹縣','苗栗縣','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'];
const FIELD = { seq:'序號', name:'店名', rating:'評分', category:'類別', price:'價位', county:'縣市', visitDate:'造訪日期', note:'心得備註', photo:'照片連結', address:'地址', googleName:'Google Maps店名', googleUrl:'Google Maps網址' };

let allRows = [];
let filteredRows = [];
let currentMode = 'list';
let map;
let markerLayer;
let mapReady = false;
let geocodeRunning = false;
const geocodeCacheKey = 'petlist-geocode-cache-v1';
const geocodeCache = loadGeocodeCache();

function countyIndex(county) {
  const index = COUNTY_ORDER.indexOf(county);
  return index === -1 ? COUNTY_ORDER.length : index;
}

function escapeHtml(value) {
  return (value || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadGeocodeCache() {
  try { return JSON.parse(localStorage.getItem(geocodeCacheKey) || '{}'); }
  catch (error) { return {}; }
}

function saveGeocodeCache() {
  localStorage.setItem(geocodeCacheKey, JSON.stringify(geocodeCache));
}

async function loadExternalGeocodeCache() {
  try {
    const response = await fetch('geocode_cache.json', { cache: 'no-store' });
    if (!response.ok) return;
    Object.assign(geocodeCache, await response.json());
    saveGeocodeCache();
  } catch (error) {
    // The generated cache file is optional; without it, the page geocodes gradually.
  }
}

function parseGviz(text) {
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('Google Sheet 回傳格式不正確');
  return JSON.parse(text.slice(start, end + 1));
}

fetch(URL_GVIZ)
  .then(response => response.text())
  .then(async text => {
    const json = parseGviz(text);
    const cols = json.table.cols.map(col => col.label || col.id);
    allRows = json.table.rows.map(row => {
      const item = {};
      cols.forEach((col, index) => {
        const cell = row.c[index];
        item[col] = cell ? (cell.f !== undefined ? cell.f : cell.v) : '';
      });
      return item;
    }).filter(row => row[FIELD.name]);
    await loadExternalGeocodeCache();
    populateCountyFilter(allRows);
    render();
    document.getElementById('loading').style.display = 'none';
  })
  .catch(error => {
    document.getElementById('loading').textContent = '讀取失敗，請確認 Google Sheet 已開放知道連結者可檢視。' + error;
  });

function populateCountyFilter(rows) {
  const select = document.getElementById('countyFilter');
  select.innerHTML = '<option value="">全部縣市</option>';
  [...new Set(rows.map(row => row[FIELD.county]).filter(Boolean))]
    .sort((a,b) => countyIndex(a) - countyIndex(b) || a.localeCompare(b, 'zh-Hant'))
    .forEach(county => {
      const option = document.createElement('option');
      option.value = county;
      option.textContent = county;
      select.appendChild(option);
    });
}

function getFilteredRows() {
  const keyword = document.getElementById('search').value.trim().toLowerCase();
  const dateKeyword = document.getElementById('dateSearch').value.trim().toLowerCase();
  const noteKeyword = document.getElementById('noteSearch').value.trim().toLowerCase();
  const county = document.getElementById('countyFilter').value;
  return allRows.filter(row => {
    const text = [row[FIELD.name], row[FIELD.category], row[FIELD.address], row[FIELD.googleName]].join(' ').toLowerCase();
    if (keyword && !text.includes(keyword)) return false;
    if (dateKeyword && !(row[FIELD.visitDate] || '').toString().toLowerCase().includes(dateKeyword)) return false;
    if (noteKeyword && !(row[FIELD.note] || '').toString().toLowerCase().includes(noteKeyword)) return false;
    if (county && row[FIELD.county] !== county) return false;
    return true;
  });
}

function render() {
  filteredRows = getFilteredRows();
  document.getElementById('stats').textContent = `共 ${filteredRows.length} 個地點`;
  currentMode === 'list' ? renderList() : renderMap();
}

function renderList() {
  document.getElementById('content').style.display = '';
  document.getElementById('mapShell').style.display = 'none';
  document.getElementById('geoStats').textContent = '';
  const content = document.getElementById('content');
  content.innerHTML = '';
  if (!filteredRows.length) {
    content.innerHTML = '<div class="empty">沒有符合條件的地點</div>';
    return;
  }
  const groups = {};
  filteredRows.forEach(row => {
    const county = row[FIELD.county] || '未填縣市';
    (groups[county] = groups[county] || []).push(row);
  });
  Object.keys(groups).sort((a,b) => countyIndex(a) - countyIndex(b) || a.localeCompare(b, 'zh-Hant')).forEach(county => {
    const group = document.createElement('div');
    group.className = 'county-group';
    group.innerHTML = `<div class="county-title">${escapeHtml(county)} (${groups[county].length})</div>`;
    const list = document.createElement('ul');
    list.className = 'list';
    groups[county].forEach(row => list.appendChild(createListItem(row)));
    group.appendChild(list);
    content.appendChild(group);
  });
}

function createListItem(row) {
  const item = document.createElement('li');
  item.className = 'item';
  const meta = [];
  if (row[FIELD.rating]) meta.push(`<span class="rating">★ ${escapeHtml(row[FIELD.rating])}</span>`);
  if (row[FIELD.category]) meta.push(escapeHtml(row[FIELD.category]));
  if (row[FIELD.price]) meta.push(escapeHtml(row[FIELD.price]));
  const extra = [];
  if (row[FIELD.visitDate]) extra.push(`<div><b>造訪日期：</b>${escapeHtml(row[FIELD.visitDate])}</div>`);
  if (row[FIELD.note]) extra.push(`<div><b>心得備註：</b>${escapeHtml(row[FIELD.note])}</div>`);
  if (row[FIELD.photo]) extra.push(`<div><b>照片：</b><a class="maplink" href="${escapeHtml(row[FIELD.photo])}" target="_blank" rel="noopener">開啟照片</a></div>`);
  item.innerHTML = `
    <div class="name">${escapeHtml(row[FIELD.name])}</div>
    <div class="meta">${meta.join(' · ')}</div>
    ${row[FIELD.address] ? `<div class="addr">${escapeHtml(row[FIELD.address])}</div>` : ''}
    ${row[FIELD.googleUrl] ? `<a class="maplink" href="${escapeHtml(row[FIELD.googleUrl])}" target="_blank" rel="noopener">開啟 Google Maps</a>` : ''}
    ${extra.length ? `<div class="extra">${extra.join('')}</div>` : ''}
  `;
  return item;
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('listModeBtn').classList.toggle('active', mode === 'list');
  document.getElementById('mapModeBtn').classList.toggle('active', mode === 'map');
  render();
}

function initMap() {
  if (mapReady) return;
  map = L.map('map', { zoomControl: true }).setView([23.75, 121.0], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  markerLayer = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 42 });
  map.addLayer(markerLayer);
  mapReady = true;
}

function renderMap() {
  document.getElementById('content').style.display = 'none';
  document.getElementById('mapShell').style.display = 'block';
  initMap();
  setTimeout(() => map.invalidateSize(), 60);
  drawKnownMarkers();
  geocodeVisibleRows();
}

function cacheKeyForRow(row) {
  return `${row[FIELD.name]}|${row[FIELD.address]}`;
}

function drawKnownMarkers() {
  markerLayer.clearLayers();
  let plotted = 0;
  filteredRows.forEach(row => {
    const cached = geocodeCache[cacheKeyForRow(row)];
    if (!cached || cached.error || cached.lat === undefined || cached.lng === undefined) return;
    markerLayer.addLayer(L.marker([cached.lat, cached.lng]).bindPopup(createPopupHtml(row)));
    plotted += 1;
  });
  updateGeoStats(plotted);
  fitMapToMarkers(false);
}

function createPopupHtml(row) {
  const meta = [row[FIELD.rating] ? `★ ${row[FIELD.rating]}` : '', row[FIELD.category], row[FIELD.price]].filter(Boolean).map(escapeHtml).join(' · ');
  const maps = row[FIELD.googleUrl] ? `<div><a class="maplink" href="${escapeHtml(row[FIELD.googleUrl])}" target="_blank" rel="noopener">開啟 Google Maps</a></div>` : '';
  return `<div class="popup-name">${escapeHtml(row[FIELD.name])}</div><div class="popup-meta">${meta}</div><div class="popup-addr">${escapeHtml(row[FIELD.address] || '')}</div>${maps}`;
}

function updateGeoStats(plotted) {
  const rowsWithAddress = filteredRows.filter(row => row[FIELD.address]).length;
  document.getElementById('geoStats').textContent = `地圖標記 ${plotted}/${rowsWithAddress}`;
  document.getElementById('mapStatus').textContent = `目前篩選 ${filteredRows.length} 筆；已在地圖顯示 ${plotted} 筆。`;
}

async function geocodeVisibleRows() {
  if (geocodeRunning) return;
  geocodeRunning = true;
  const queue = filteredRows.filter(row => row[FIELD.address] && (!geocodeCache[cacheKeyForRow(row)] || geocodeCache[cacheKeyForRow(row)].error));
  for (const row of queue) {
    if (currentMode !== 'map') break;
    const key = cacheKeyForRow(row);
    try {
      const result = await geocodeAddress(row[FIELD.address], row[FIELD.name]);
      geocodeCache[key] = result || { error: true };
      saveGeocodeCache();
      drawKnownMarkers();
      await wait(1100);
    } catch (error) {
      geocodeCache[key] = { error: true };
      saveGeocodeCache();
      await wait(1100);
    }
  }
  geocodeRunning = false;
}

async function geocodeAddress(address, name) {
  const cleaned = normalizeTaiwanAddress(address);
  const queries = [`${cleaned} ${name}`, cleaned, removePostalCode(cleaned), reduceAddress(cleaned)].filter((value, index, list) => value && list.indexOf(value) === index);
  for (const query of queries) {
    const result = await queryNominatim(query);
    if (result) return result;
    await wait(350);
  }
  return null;
}

function normalizeTaiwanAddress(address) {
  return (address || '').replace(/^台灣/, '').replace(/臺灣/g, '').replace(/台北/g, '臺北').replace(/台中/g, '臺中').replace(/台南/g, '臺南').replace(/台東/g, '臺東').trim();
}

function removePostalCode(address) {
  return address.replace(/^\d{3,6}/, '').trim();
}

function reduceAddress(address) {
  const match = removePostalCode(address).match(/^(.+?[縣市].+?[區鄉鎮市].+?(?:路|街|大道|巷))/);
  return match ? match[1] : removePostalCode(address);
}

async function queryNominatim(query) {
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&q=' + encodeURIComponent(query);
  const response = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!response.ok) return null;
  const data = await response.json();
  if (!data || !data.length) return null;
  return { lat: Number(data[0].lat), lng: Number(data[0].lon) };
}

function fitMapToMarkers(force) {
  if (!mapReady || !markerLayer || markerLayer.getLayers().length === 0) return;
  if (!force && map._petlistAlreadyFit) return;
  map.fitBounds(markerLayer.getBounds(), { padding: [24, 24], maxZoom: 15 });
  map._petlistAlreadyFit = true;
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

document.getElementById('search').addEventListener('input', () => { if (map) map._petlistAlreadyFit = false; render(); });
document.getElementById('dateSearch').addEventListener('input', render);
document.getElementById('noteSearch').addEventListener('input', render);
document.getElementById('countyFilter').addEventListener('change', () => { if (map) map._petlistAlreadyFit = false; render(); });
document.getElementById('listModeBtn').addEventListener('click', () => setMode('list'));
document.getElementById('mapModeBtn').addEventListener('click', () => setMode('map'));
document.getElementById('fitMapBtn').addEventListener('click', () => fitMapToMarkers(true));
</script>
</body>
</html>
